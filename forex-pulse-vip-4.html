const TF_CONFIG = [
  { key: "15min", label: "15M", weight: 0.15, points: 60 },
  { key: "1h", label: "1H", weight: 0.25, points: 80 },
  { key: "4h", label: "4H", weight: 0.30, points: 80 },
  { key: "1day", label: "1D", weight: 0.30, points: 80 },
];

function ema(values, period) {
  const k = 2 / (period + 1);
  const out = [];
  let prev;
  values.forEach((v, i) => { prev = i === 0 ? v : v * k + prev * (1 - k); out.push(prev); });
  return out;
}

function rsi(closes, period = 14) {
  const out = new Array(closes.length).fill(null);
  if (closes.length <= period) return out;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d >= 0) gains += d; else losses -= d;
  }
  let avgGain = gains / period, avgLoss = losses / period;
  out[period] = 100 - 100 / (1 + (avgLoss === 0 ? 100 : avgGain / avgLoss));
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    const g = d > 0 ? d : 0, l = d < 0 ? -d : 0;
    avgGain = (avgGain * (period - 1) + g) / period;
    avgLoss = (avgLoss * (period - 1) + l) / period;
    const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
    out[i] = 100 - 100 / (1 + rs);
  }
  return out;
}

function macdHist(closes) {
  const e12 = ema(closes, 12), e26 = ema(closes, 26);
  const macdLine = closes.map((_, i) => e12[i] - e26[i]);
  const signal = ema(macdLine, 9);
  return macdLine.map((v, i) => v - signal[i]);
}

function atr(candles, period = 14) {
  const trs = candles.map((c, i) => {
    if (i === 0) return c.high - c.low;
    const pc = candles[i - 1].close;
    return Math.max(c.high - c.low, Math.abs(c.high - pc), Math.abs(c.low - pc));
  });
  const out = [];
  let sum = 0;
  trs.forEach((tr, i) => {
    if (i < period) { sum += tr; out.push(i === period - 1 ? sum / period : null); }
    else { const prev = out[i - 1] ?? tr; out.push((prev * (period - 1) + tr) / period); }
  });
  return out;
}

function analyzeCandles(candles) {
  const closes = candles.map((c) => c.close);
  const e20 = ema(closes, 20), e50 = ema(closes, 50);
  const rsiArr = rsi(closes, 14);
  const hist = macdHist(closes);
  const atrArr = atr(candles, 14);
  const last = closes.length - 1;

  const price = closes[last];
  const emaFast = e20[last], emaSlow = e50[last];
  const rsiVal = rsiArr[last] ?? 50;
  const histVal = hist[last] ?? 0;
  const histPrev = hist[last - 1] ?? histVal;
  const atrVal = atrArr[last] ?? 0;

  let score = 0;
  score += price > emaFast ? 0.25 : -0.25;
  score += emaFast > emaSlow ? 0.25 : -0.25;
  score += histVal > 0 ? 0.25 : -0.25;
  score += rsiVal > 55 ? 0.25 : rsiVal < 45 ? -0.25 : 0;

  const recent = candles.slice(-30);
  const resistance = Math.max(...recent.map((c) => c.high));
  const support = Math.min(...recent.map((c) => c.low));

  return {
    price, emaFast, emaSlow, rsi: rsiVal, hist: histVal, histPrev, atr: atrVal,
    support, resistance, score,
    label: score >= 0.5 ? "Bullish" : score <= -0.5 ? "Bearish" : "Choppy",
    sparkline: closes.slice(-40),
  };
}

function computeSignal(results, overall, triggerKey, price) {
  const trig = results[triggerKey];
  const t4 = results["4h"].score, t1d = results["1day"].score;
  const higherAligned = Math.sign(t4) === Math.sign(t1d) && t4 !== 0;
  const macdRising = trig.hist > trig.histPrev;
  const macdFalling = trig.hist < trig.histPrev;

  let direction = "WAIT";
  const reasons = [];

  if (overall.score >= 0.4 && higherAligned && t4 > 0) {
    if (trig.rsi < 70 && trig.hist > 0 && macdRising) {
      direction = "BUY";
      reasons.push("4H and 1D both trending up — higher-timeframe filter confirms");
      reasons.push("MACD momentum on trigger TF is positive and rising");
      reasons.push(`RSI at ${trig.rsi.toFixed(1)} — not yet overbought`);
    } else {
      reasons.push("4H/1D bias is bullish, but trigger TF momentum hasn't confirmed yet — wait");
    }
  } else if (overall.score <= -0.4 && higherAligned && t4 < 0) {
    if (trig.rsi > 30 && trig.hist < 0 && macdFalling) {
      direction = "SELL";
      reasons.push("4H and 1D both trending down — higher-timeframe filter confirms");
      reasons.push("MACD momentum on trigger TF is negative and falling");
      reasons.push(`RSI at ${trig.rsi.toFixed(1)} — not yet oversold`);
    } else {
      reasons.push("4H/1D bias is bearish, but trigger TF momentum hasn't confirmed yet — wait");
    }
  } else {
    reasons.push("4H and 1D aren't aligned, or confidence is too low — no clean edge right now");
  }

  let stop = null, target = null, target2 = null, rr = null;
  const a = trig.atr || 0;
  if (direction === "BUY") {
    stop = price - a * 1.5;
    const dist = price - stop;
    target = price + dist * 2;
    target2 = price + dist * 3;
    rr = "2 / 3";
  } else if (direction === "SELL") {
    stop = price + a * 1.5;
    const dist = stop - price;
    target = price - dist * 2;
    target2 = price - dist * 3;
    rr = "2 / 3";
  }
  return { direction, reasons, stop, target, target2, rr };
}

// --- Prop-firm position sizing ---------------------------------------
// Pip value per 1.0 standard lot, in USD. Only handles pair shapes we
// can compute accurately without a live cross-rate feed:
//  - XXX/USD (USD is quote): fixed $10/pip
//  - USD/XXX non-JPY (USD is base): $10/price
//  - */JPY (JPY is quote): ~1000/price
// Anything else (e.g. EUR/GBP) returns null — needs a manual pip-value
// lookup from your broker, since accurate conversion needs a second
// live exchange rate this tool doesn't fetch.
function pipValuePerStandardLot(symbol, price) {
  const s = symbol.toUpperCase().replace("/", "");
  if (s.startsWith("XAU")) return 1;   // gold: 100oz/lot, $0.01 tick = $1/point/standard lot
  if (s.startsWith("XAG")) return 5;   // silver: 5000oz/lot, approx $0.001 tick = $5/point/standard lot
  if (s.startsWith("BTC")) return 1;   // verified against real broker trade: $1 move = $1/lot at 1.0 lot
  if (s.endsWith("JPY")) return 1000 / price;
  if (s.endsWith("USD")) return 10;
  if (s.startsWith("USD")) return 10 / price;
  return null;
}
function pipSize(symbol) {
  const s = symbol.toUpperCase().replace("/", "");
  if (s.startsWith("XAU")) return 0.01;
  if (s.startsWith("XAG")) return 0.001;
  if (s.startsWith("BTC")) return 1;   // "point" = $1 move for BTC
  if (s.includes("JPY")) return 0.01;
  return 0.0001;
}

function calcPropFirmSizing({ symbol, price, signal, accountBalance, riskPercent, todaysPnl, dailyDrawdownPct, maxDrawdownPct }) {
  if (!signal || signal.direction === "WAIT") return null;
  const pip = pipSize(symbol);
  const stopDist = Math.abs(price - signal.stop);
  const stopPips = stopDist / pip;
  const pipVal = pipValuePerStandardLot(symbol, price);

  const dailyLimit = accountBalance * (dailyDrawdownPct / 100);
  const staticFloor = accountBalance * (1 - maxDrawdownPct / 100);
  const remainingDailyRoom = dailyLimit + Math.min(todaysPnl, 0);

  let riskDollars = accountBalance * (riskPercent / 100);
  let capped = false;
  if (riskDollars > remainingDailyRoom) {
    riskDollars = Math.max(remainingDailyRoom, 0);
    capped = true;
  }
  if (!pipVal || stopPips <= 0 || riskDollars <= 0) {
    return { unsupported: !pipVal, blocked: riskDollars <= 0, dailyLimit, staticFloor, remainingDailyRoom };
  }

  const lots = riskDollars / (stopPips * pipVal);
  const rewardTP1 = lots * stopPips * 2 * pipVal;
  const rewardTP2 = lots * stopPips * 3 * pipVal;
  return { lots, riskDollars, rewardTP1, rewardTP2, stopPips, capped, dailyLimit, staticFloor, remainingDailyRoom };
}

function nextCandleClose(triggerKey) {
  const intervalMs = triggerKey === "15min" ? 15*60*1000 : triggerKey === "1h" ? 60*60*1000 : 4*60*60*1000;
  const now = Date.now();
  return new Date(Math.ceil(now / intervalMs) * intervalMs);
}
function formatCountdown(ms) {
  if (ms <= 0) return "closing now";
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
}

function biasColor(score) { return score >= 0.5 ? "#3DDC97" : score <= -0.5 ? "#FF5C5C" : "#8B93A1"; }
function biasArrow(score) { return score >= 0.5 ? "▲" : score <= -0.5 ? "▼" : "■"; }

function Sparkline({ data, color }) {
  const w = 260, h = 50;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => `${(i/(data.length-1))*w},${h - ((v-min)/range)*h}`).join(" ");
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" />
    </svg>
  );
}

function Row({ label, value, tone }) {

function RsiRow({ value }) {

          <div style={{position:"absolute",left:`${Math.max(0,Math.min(100,value))}%`,top:-2,width:8,height:8,borderRadius:"50%",background:color,transform:"translateX(-50%)"}} />

}

function PropFirmPanel({ symbol, price, signal, accountBalance, setAccountBalance, riskTier, setRiskTier, todaysPnl, setTodaysPnl, dailyDrawdownPct, setDailyDrawdownPct, maxDrawdownPct, setMaxDrawdownPct }) {
  const sizing = calcPropFirmSizing({ symbol, price, signal, accountBalance, riskPercent: riskTier, todaysPnl, dailyDrawdownPct, maxDrawdownPct });
  const dailyLimit = accountBalance * (dailyDrawdownPct / 100);
  const staticFloor = accountBalance * (1 - maxDrawdownPct / 100);
  const dir = signal.direction;

  const block = sizing && !sizing.unsupported && !sizing.blocked ? `=========================================
      ⚡ VALID SIGNAL DETECTED ⚡
=========================================
Pair: ${symbol}
Direction: ${dir}
Entry Price: ${price.toFixed(5)}
Stop Loss: ${signal.stop.toFixed(5)} (${sizing.stopPips.toFixed(1)} Pips)
Take Profit 1 (1:2): ${signal.target.toFixed(5)}
Take Profit 2 (1:3): ${signal.target2.toFixed(5)}

-----------------------------------------
📊 POSITION SIZING (${sizing.capped ? "Capped by daily limit" : `Risk: ${riskTier}% / $${sizing.riskDollars.toFixed(2)}`})
-----------------------------------------
Calculated Lot Size: ${sizing.lots.toFixed(2)} Lots
Max Loss on Hit: -$${sizing.riskDollars.toFixed(2)}
Est. Reward on TP1: +$${sizing.rewardTP1.toFixed(2)}
Est. Reward on TP2: +$${sizing.rewardTP2.toFixed(2)}
=========================================` : null;

  return (
    <div className="fp-panel" style={{padding:18,marginBottom:18,border:"1px solid #232A34"}}>
      <div style={{fontSize:11,color:"#5B6472",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>
        Prop-Firm Position Sizing
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
        <label style={{fontSize:11,color:"#7C8798"}}>Account Balance
          <input className="fp-input" type="number" value={accountBalance}
            onChange={e=>setAccountBalance(Math.max(0, parseFloat(e.target.value)||0))}
            style={{display:"block",width:140,marginTop:4}} />
        </label>
        <label style={{fontSize:11,color:"#7C8798"}}>Today's P/L so far ($, negative if loss)
          <input className="fp-input" type="number" value={todaysPnl}
            onChange={e=>setTodaysPnl(parseFloat(e.target.value)||0)}
            style={{display:"block",width:140,marginTop:4}} />
        </label>
        <label style={{fontSize:11,color:"#7C8798"}}>Daily drawdown %
          <input className="fp-input" type="number" step="0.5" value={dailyDrawdownPct}
            onChange={e=>setDailyDrawdownPct(Math.max(0.1, parseFloat(e.target.value)||0.1))}
            style={{display:"block",width:100,marginTop:4}} />
        </label>
        <label style={{fontSize:11,color:"#7C8798"}}>Max drawdown %
          <input className="fp-input" type="number" step="0.5" value={maxDrawdownPct}
            onChange={e=>setMaxDrawdownPct(Math.max(0.1, parseFloat(e.target.value)||0.1))}
            style={{display:"block",width:100,marginTop:4}} />
        </label>
        <div style={{fontSize:11,color:"#7C8798"}}>Risk Tier
          <div style={{display:"flex",gap:6,marginTop:4}}>
            <button className="fp-display" onClick={()=>setRiskTier(0.5)} style={{
              background: riskTier===0.5?"#E8A33D":"transparent", color: riskTier===0.5?"#0B0E13":"#7C8798",
              border:"1px solid #232A34",borderRadius:5,padding:"9px 12px",fontSize:11,fontWeight:700,cursor:"pointer"
            }}>Base 0.5%</button>
            <button className="fp-display" onClick={()=>setRiskTier(1.0)} style={{
              background: riskTier===1.0?"#E8A33D":"transparent", color: riskTier===1.0?"#0B0E13":"#7C8798",
              border:"1px solid #232A34",borderRadius:5,padding:"9px 12px",fontSize:11,fontWeight:700,cursor:"pointer"
            }}>Aggressive 1.0%</button>
          </div>
        </div>
      </div>

      <div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:12,marginBottom:14,color:"#9AA3B0"}}>
        <div>Daily loss limit: <b style={{color:"#FF5C5C"}}>-${dailyLimit.toFixed(0)}</b></div>
        <div>Static floor: <b style={{color:"#FF5C5C"}}>${staticFloor.toFixed(0)}</b></div>
        <div>Remaining daily room: <b style={{color:"#3DDC97"}}>${sizing ? Math.max(sizing.remainingDailyRoom,0).toFixed(0) : dailyLimit.toFixed(0)}</b></div>
      </div>

      {sizing && sizing.unsupported && (
        <div style={{color:"#FF5C5C",fontSize:12.5,marginBottom:10}}>
          ⚠ Can't auto-calculate pip value for {symbol} without a live cross-rate — check your broker's contract
          specification for exact pip value per lot, then size manually using the stop distance above.
        </div>
      )}
      {sizing && sizing.blocked && !sizing.unsupported && (

        USD-base and JPY pairs). Verify against your contract specs before trading — a mismatch here directly
        risks an account breach. This does not read your live floating P/L; "Today's P/L" is self-reported, so
        keep it updated manually.

    </div>

}

function ForexPulse() {
  const [unlocked, setUnlocked] = useState(false);
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [symbol, setSymbol] = useState("EUR/USD");
  const [symbolInput, setSymbolInput] = useState("EUR/USD");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [results, setResults] = useState(null);
  const [quote, setQuote] = useState(null);
  const [triggerTF, setTriggerTF] = useState("1h");
  const [accountBalance, setAccountBalance] = useState(100000);
  const [riskTier, setRiskTier] = useState(0.5);
  const [todaysPnl, setTodaysPnl] = useState(0);
  const [dailyDrawdownPct, setDailyDrawdownPct] = useState(5);
  const [maxDrawdownPct, setMaxDrawdownPct] = useState(12);
  const [tick, setTick] = useState(0);

  useEffect(() => { const id = setInterval(()=>setTick(t=>t+1),1000); return ()=>clearInterval(id); }, []);

  const runAnalysis = useCallback(async () => {
    if (!apiKey.trim()) { setError("Enter your Twelve Data API key first."); return; }
    if (!symbolInput.trim()) { setError("Enter a pair, e.g. EUR/USD or XAU/USD."); return; }
    setLoading(true); setError("");
    const sym = symbolInput.trim().toUpperCase();
    try {
      const quoteRes = await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(sym)}&apikey=${encodeURIComponent(apiKey)}`);
      const quoteJson = await quoteRes.json();
      if (quoteJson.status === "error" || quoteJson.code >= 400) throw new Error(quoteJson.message || "Symbol or API key rejected.");
      setQuote(quoteJson);

      const out = {};
      for (const tf of TF_CONFIG) {
        const res = await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${tf.key}&outputsize=${tf.points}&apikey=${encodeURIComponent(apiKey)}`);
        const json = await res.json();
        if (json.status === "error") throw new Error(`${tf.label}: ${json.message}`);
        const candles = json.values.map(v => ({
          close: parseFloat(v.close), high: parseFloat(v.high), low: parseFloat(v.low), open: parseFloat(v.open),
        })).reverse();
        if (candles.length < 30) throw new Error(`${tf.label}: not enough candle history returned.`);
        out[tf.key] = analyzeCandles(candles);
      }
      setResults(out); setSymbol(sym);
    } catch (e) {
      setError(e.message || "Fetch failed — check your API key, symbol, or rate limit (8 req/min free tier).");
      setResults(null);
    } finally { setLoading(false); }
  }, [apiKey, symbolInput]);

  const overall = results ? (() => {
    let weighted = 0;
    TF_CONFIG.forEach(tf => { weighted += results[tf.key].score * tf.weight; });
    const dirs = TF_CONFIG.map(tf => Math.sign(results[tf.key].score));
    const agree = dirs.filter(d => d === Math.sign(weighted) && d !== 0).length;
    return { score: weighted, confidence: Math.round((agree/TF_CONFIG.length)*100) };
  })() : null;

  const signal = results && overall && quote ? computeSignal(results, overall, triggerTF, parseFloat(quote.close)) : null;

  if (!unlocked) {
    return <AccessGate onUnlock={() => setUnlocked(true)} />;
  }

  return (
    <div style={{minHeight:"100vh",padding:"20px 14px 60px"}}>
      <div style={{maxWidth:980,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:4}}>
          <span style={{color:"#E8A33D",fontSize:20}}>◆</span>
          <h1 className="fp-display" style={{fontSize:24,fontWeight:700,margin:0}}>FX PULSE</h1>
          <span style={{color:"#5B6472",fontSize:12}}>multi-timeframe read, not a signal</span>
        </div>
        <p style={{color:"#7C8798",fontSize:12.5,margin:"0 0 20px",maxWidth:640,lineHeight:1.5}}>
          Reads trend, momentum, and range across 15M / 1H / 4H / 1D at once using your free Twelve Data key.
          Your key stays in your browser only — this page never sends it anywhere but Twelve Data.
        </p>

        <div className="fp-panel" style={{padding:16,marginBottom:18}}>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <input className="fp-input" placeholder="API key" type={showKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} style={{width:200}} />
              <button onClick={()=>setShowKey(s=>!s)} style={{background:"none",border:"none",cursor:"pointer",color:"#7C8798"}}>{showKey?"hide":"show"}</button>
            </div>
            <select className="fp-input" value={symbolInput} onChange={e=>setSymbolInput(e.target.value)} style={{width:160}}>
              <option value="EUR/USD">EUR/USD</option>
              <option value="XAU/USD">XAU/USD (Gold)</option>
              <option value="BTC/USD">BTC/USD (Bitcoin)</option>
            </select>
            <button className="fp-btn" onClick={runAnalysis} disabled={loading}>{loading?"Analyzing…":"Analyze"}</button>
          </div>
          <div style={{fontSize:11,color:"#5B6472",marginTop:8}}>No key? Get one free at twelvedata.com/pricing — no card required.</div>
          {error && <div style={{marginTop:10,color:"#FF5C5C",fontSize:12.5}}>⚠ {error}</div>}
        </div>

        {quote && results && (
          <>
            <div className="fp-panel" style={{padding:"14px 18px",marginBottom:18,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
              <div>
                <div className="fp-display" style={{fontSize:20,fontWeight:700}}>{symbol}</div>
                <div style={{fontSize:11,color:"#5B6472"}}>live quote</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="fp-display" style={{fontSize:22,fontWeight:700}}>{parseFloat(quote.close).toFixed(5)}</div>
                <div style={{fontSize:12.5,color: parseFloat(quote.percent_change)>=0?"#3DDC97":"#FF5C5C"}}>
                  {parseFloat(quote.percent_change)>=0?"+":""}{parseFloat(quote.percent_change).toFixed(2)}%
                </div>
              </div>
            </div>

            <div className="fp-panel" style={{padding:"16px 18px",marginBottom:18}}>
              <div style={{fontSize:11,color:"#5B6472",marginBottom:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>Timeframe alignment</div>
              <div style={{display:"flex",gap:8}}>
                {TF_CONFIG.map(tf => {
                  const r = results[tf.key]; const color = biasColor(r.score);
                  const height = 20 + Math.abs(r.score)*26;
                  return (
                    <div key={tf.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                      <div style={{height:46,display:"flex",alignItems:"flex-end"}}>
                        <div style={{width:26,height,background:color,borderRadius:3,opacity:0.85}} />
                      </div>
                      <span style={{color}}>{biasArrow(r.score)}</span>
                      <div style={{fontSize:11,color:"#7C8798"}}>{tf.label}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="fp-panel" style={{padding:18,marginBottom:18,border:`1px solid ${biasColor(overall.score)}55`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
                <div>
                  <div style={{fontSize:11,color:"#5B6472",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>Weighted bias (4H/1D lead)</div>
                  <div className="fp-display" style={{fontSize:26,fontWeight:700,color:biasColor(overall.score)}}>
                    {overall.score>=0.5?"Bullish":overall.score<=-0.5?"Bearish":"Choppy / No clear edge"}
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:11,color:"#5B6472"}}>Alignment confidence</div>
                  <div className="fp-display" style={{fontSize:26,fontWeight:700}}>{overall.confidence}%</div>
                </div>
              </div>
            </div>

            <div className="fp-panel" style={{padding:18,marginBottom:18,border:`1px solid ${signal.direction==="BUY"?"#3DDC9755":signal.direction==="SELL"?"#FF5C5C55":"#1E242D"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:12}}>
                <div style={{fontSize:11,color:"#5B6472",textTransform:"uppercase",letterSpacing:"0.08em"}}>Signal · trigger TF</div>
                <div style={{display:"flex",gap:6}}>
                  {["15min","1h","4h"].map(k => (
                    <button key={k} onClick={()=>setTriggerTF(k)} className="fp-display" style={{
                      background: triggerTF===k?"#E8A33D":"transparent", color: triggerTF===k?"#0B0E13":"#7C8798",
                      border:"1px solid #232A34",borderRadius:5,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer"
                    }}>{TF_CONFIG.find(t=>t.key===k).label}</button>
                  ))}
                </div>
              </div>
              <div className="fp-display" style={{fontSize:30,fontWeight:700,marginBottom:12,
                color: signal.direction==="BUY"?"#3DDC97":signal.direction==="SELL"?"#FF5C5C":"#8B93A1"}}>
                {signal.direction}
              </div>
              {signal.direction!=="WAIT" && (
                <div style={{display:"flex",gap:20,flexWrap:"wrap",marginBottom:12,fontSize:13}}>
                  <div><span style={{color:"#5B6472"}}>Entry </span><b>{parseFloat(quote.close).toFixed(5)}</b></div>
                  <div><span style={{color:"#5B6472"}}>Stop </span><b style={{color:"#FF5C5C"}}>{signal.stop.toFixed(5)}</b></div>
                  <div><span style={{color:"#5B6472"}}>TP1 (1:2) </span><b style={{color:"#3DDC97"}}>{signal.target.toFixed(5)}</b></div>
                  <div><span style={{color:"#5B6472"}}>TP2 (1:3) </span><b style={{color:"#3DDC97"}}>{signal.target2.toFixed(5)}</b></div>
                </div>
              )}
              <ul style={{margin:0,paddingLeft:18,color:"#9AA3B0",fontSize:12.5,lineHeight:1.7}}>
                {signal.reasons.map((r,i)=><li key={i}>{r}</li>)}
              </ul>
              {signal.direction==="WAIT" && (
                <div style={{marginTop:14,padding:"12px 14px",background:"#0E1217",border:"1px solid #232A34",borderRadius:8}}>
                  <div style={{fontSize:11,color:"#5B6472",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:4}}>Next meaningful check</div>
                  <div className="fp-display" style={{fontSize:18,fontWeight:700,color:"#E8A33D"}}>
                    {formatCountdown(nextCandleClose(triggerTF).getTime() - Date.now())}
                  </div>
                  <div style={{fontSize:11.5,color:"#7C8798",marginTop:4}}>
                    {TF_CONFIG.find(t=>t.key===triggerTF).label} candle closes at {nextCandleClose(triggerTF).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})} (your local time).
                  </div>
                </div>
              )}
              <div style={{fontSize:10.5,color:"#454C57",marginTop:12,lineHeight:1.5}}>
                Rule-based on EMA/RSI/MACD/ATR only — no news, no fundamentals. Confirm on your own chart and set your own risk before entering.
              </div>
            </div>

            {signal.direction !== "WAIT" && (
              <PropFirmPanel
                symbol={symbol} price={parseFloat(quote.close)} signal={signal}
                accountBalance={accountBalance} setAccountBalance={setAccountBalance}
                riskTier={riskTier} setRiskTier={setRiskTier}
                todaysPnl={todaysPnl} setTodaysPnl={setTodaysPnl}
                dailyDrawdownPct={dailyDrawdownPct} setDailyDrawdownPct={setDailyDrawdownPct}
                maxDrawdownPct={maxDrawdownPct} setMaxDrawdownPct={setMaxDrawdownPct}
              />
            )}

            <div className="fp-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
              {TF_CONFIG.map(tf => {
                const r = results[tf.key]; const color = biasColor(r.score);
                return (
                  <div key={tf.key} className="fp-panel" style={{padding:16}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                      <div className="fp-display" style={{fontWeight:700,fontSize:15}}>{tf.label}</div>
                      <div style={{color}}>{biasArrow(r.score)} <span style={{fontSize:12.5,fontWeight:600}}>{r.label}</span></div>
                    </div>
                    <div style={{marginBottom:10}}><Sparkline data={r.sparkline} color={color} /></div>
                    <Row label="EMA20 / EMA50" value={`${r.emaFast.toFixed(5)} / ${r.emaSlow.toFixed(5)}`} tone={r.emaFast>r.emaSlow?"up":"down"} />
                    <RsiRow value={r.rsi} />
                    <Row label="MACD hist" value={r.hist.toFixed(5)} tone={r.hist>0?"up":"down"} />
                    <Row label="ATR(14)" value={r.atr.toFixed(5)} tone="flat" />
                    <Row label="Support" value={r.support.toFixed(5)} tone="flat" />
                    <Row label="Resistance" value={r.resistance.toFixed(5)} tone="flat" />
                  </div>
                );
              })}
            </div>
          </>
        )}

        {!results && !loading && (
          <div className="fp-panel" style={{padding:40,textAlign:"center",color:"#5B6472",fontSize:13}}>
            Drop in an API key and a pair, then hit Analyze.
          </div>
        )}

        <p style={{fontSize:11,color:"#454C57",marginTop:26,lineHeight:1.6}}>
          Educational technical analysis only. Not financial advice. Size risk accordingly.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ForexPulse />);
</script>
</body>
</html>
